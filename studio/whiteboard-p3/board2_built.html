 // transition into scene i (from i-1) or out to i+1
 let a=null,b=null,u=0;
 if(i>0&&t<TIMES[i].start+h){a=i-1;b=i;u=(t-(TIMES[i].start-h))/(2*h)}
 else if(i<n-1&&t>TIMES[i].end-h){a=i;b=i+1;u=(t-(TIMES[i].end-h))/(2*h)}
 if(a===null){const p=c(i);return {x:p.x,y:p.y,s:z(i,t),moving:0}}
 const e=ease(u),pa=c(a),pb=c(b),s=(z(a,TIMES[a].end)*(1-e)+1*e)*(1-0.22*Math.sin(Math.PI*clamp(u)));
 return {x:pa.x+(pb.x-pa.x)*e,y:pa.y+(pb.y-pa.y)*e,s,moving:Math.sin(Math.PI*clamp(u))}}
window.renderAt=function(t){const cm=camAt(t);
 cam.setAttribute('transform',`translate(540 960) scale(${cm.s}) translate(${-cm.x} ${-cm.y})`);
 let pen=null;
 built.forEach((b,si)=>{const {start,end}=TIMES[si],D=end-start,lt=t-start;
  b.els.forEach(e=>{const a=e.t0*D,z=e.t1*D;const p=e.pre?1:clamp((lt-a)/Math.max(.05,z-a));
   if(e.kind==='p'){const show=p>0;
     for(const el of [e.st,e.sk]){el.style.visibility=show?'visible':'hidden';if(!e.dash){el.style.strokeDasharray=`${e.L} ${e.L}`;el.style.strokeDashoffset=e.L*(1-p)}}
     if(e.dash){e.st.style.opacity=p;e.sk.style.opacity=.28*p}
     if(e.fill)e.fill.style.opacity=e.pre?1:clamp((lt-z)/.35);
     if(p>0&&p<1){const pt=e.st.getPointAtLength(e.L*p);pen={x:OFF[si].x+pt.x,y:OFF[si].y+pt.y}}}
   else{const n=e.glyphs.length;e.glyphs.forEach((g,gi)=>{
      const ws=a+(z-a)*.82*gi/n, wd=(z-a)*.82/n*1.7+.08; const q=e.pre?1:clamp((lt-ws)/wd);
      const qo=clamp(q/.72);g.p.style.visibility=q>0?'visible':'hidden';
      g.p.style.strokeDasharray=`${g.L} ${g.L}`;g.p.style.strokeDashoffset=g.L*(1-qo);g.p.style.fillOpacity=clamp((q-.45)/.55);
      if(q>0&&q<.72){const pt=g.p.getPointAtLength(g.L*qo);let X=g.gx+pt.x*e.sc,Y=g.gy-pt.y*e.sc;pen={x:OFF[si].x+X,y:OFF[si].y+Y}}})}
  });
  if(t>=start&&t<end){[...dots.children].forEach((d,i)=>d.className=(b.sc.q?i<b.sc.q:si>0)?'on':'')}
 });
 const drawing=!!pen&&cm.moving<.3;
 const target=drawing?{x:540+cm.s*(pen.x-cm.x),y:960+cm.s*(pen.y-cm.y)}:null;
 if(target){ if(!aim) aim={...target}; aim.x+=(target.x-aim.x)*.45; aim.y+=(target.y-aim.y)*.45; point=Math.min(1,point+.2); }
 else { point=Math.max(0,point-.07); }
 drawPresenter(t);
 const sp=prevAim&&aim&&drawing?Math.hypot(aim.x-prevAim.x,aim.y-prevAim.y):0; prevAim=aim?{...aim}:null;
 return {drawing,speed:sp,whoosh:cm.moving};
};

// ---------- presenter stickman (points at whatever is being drawn) ----------
const pc=document.getElementById('pres').getContext('2d');
let aim=null, point=0, prevAim=null;
const PX=132, PY=1770, PS=1.18;
const PRES={robe:'#f7f7f7',sash:'#2f7de1',scale:1};
const voiceAt=t=>{const v=VOICE[Math.floor(t*30)]||0;return v;};
function drawPresenter(t){
  pc.setTransform(1,0,0,1,0,0); pc.clearRect(0,0,1080,1920);
  const s=PS, shx=PX+40*s, shy=PY-190*s;
  let a=.22+.05*Math.sin(t*1.7);
  if(aim){const ap=Math.atan2(aim.x-shx,aim.y-shy); a=a+(ap-a)*ease(point);}
  const look=aim?Math.max(-1,Math.min(1,(aim.x-PX)/500))*point:0, vo=voiceAt(t);
  const p=SM.drawChar(pc,PRES,{x:PX,y:PY,s:PS,armR:a,armL:.18+.06*Math.sin(t*2.1),look,eyes:'dot',brows:point>.5?'up':'calm',mouth:'smile',talk:vo,bob:Math.abs(Math.sin(t*2.2))*3,
    extraHead:(g,R)=>{const lk=look*12; g.fillStyle=SM.INK; g.beginPath(); g.arc(0,0,R+1,Math.PI*1.08,Math.PI*1.92); g.quadraticCurveTo(0,-R*.55,-Math.cos(Math.PI*.08)*R,-Math.sin(Math.PI*.08)*R); g.fill();
      g.strokeStyle=SM.INK; g.lineWidth=4; for(const sd of[-1,1]){g.beginPath(); g.arc(sd*17+lk,-6,14,0,Math.PI*2); g.stroke();} g.beginPath(); g.moveTo(-3+lk,-7); g.lineTo(3+lk,-7); g.stroke();}});
  if(aim&&point>.25&&p.hands){const [hx,hy]=p.hands[1], al=Math.min(1,(point-.25)/.4);
    pc.save(); pc.globalAlpha=al; pc.lineCap='round';
    const gr=pc.createLinearGradient(hx,hy,aim.x,aim.y); gr.addColorStop(0,'rgba(255,200,40,.9)'); gr.addColorStop(1,'rgba(255,120,40,.35)');
    pc.strokeStyle=gr; pc.lineWidth=5; pc.setLineDash([2,16]); pc.lineDashOffset=-t*120; pc.beginPath(); pc.moveTo(hx,hy); pc.lineTo(aim.x,aim.y); pc.stroke(); pc.setLineDash([]);
    for(let k=0;k<6;k++){const q=(t*1.6+k/6)%1, x=hx+(aim.x-hx)*q, y=hy+(aim.y-hy)*q, r=6+5*Math.sin(q*Math.PI);
      pc.fillStyle='#ffd23b'; pc.beginPath(); for(let i=0;i<8;i++){const ang=i*Math.PI/4, rr=i%2?r*.38:r; pc.lineTo(x+Math.cos(ang+t*4)*rr,y+Math.sin(ang+t*4)*rr);} pc.closePath(); pc.fill();}
    const gl=pc.createRadialGradient(aim.x,aim.y,2,aim.x,aim.y,34); gl.addColorStop(0,'rgba(255,230,120,.9)'); gl.addColorStop(1,'rgba(255,200,60,0)'); pc.fillStyle=gl; pc.beginPath(); pc.arc(aim.x,aim.y,34,0,Math.PI*2); pc.fill();
    pc.restore();}
}
window.resetHand=(x,y)=>{handPos.x=x;handPos.y=y;prevHand=null};
</script></body></html>
