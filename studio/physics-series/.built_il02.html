<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script>
// "Same colour?" — simultaneous-contrast illusion in two rounds, then a reveal.
const EP = {"id":"il02","template":"illusion_samecolor.html","title":"خدعة بصرية","partLabel":"الجزء 2","hook1":"أي مربع لونه أفتح؟ جاوب قبل العد","hook2":"الجولة الثانية... أصعب","q1":"1 لو 2... أيهم أفتح؟","bridgeLine":"خلّي نوصلهم ببعض...","same1":"نفس اللون بالضبط!","same1b":"ولا فرق ولا درجة وحدة","q2":"الشريط... يتغير لونه؟","q2b":"باوع على طرفه اليسار واليمين","same2":"لونه واحد من أوله لآخره!","same2b":"الخلفية هي اللي تكذب عليك","explain1":"دماغك يقارن الألوان باللي حواليها","explain2":"مو باللون الحقيقي","cta1":"انخدعت؟ اكتب نعم لو لا","cta2":"الجزء 3: الخطين المتساويين","timeline":{"think":3,"bridge":7,"flat1":9,"round2":12.5,"flat2":18.5,"explain":21.5,"cta":24.5,"end":28}}; const T = EP.timeline; const W = 1080, H = 1920, FPS = 60;
const g = document.getElementById('cv').getContext('2d');
const GRAY = '#8a8a8a';
const font = (px, fam = 'Lalezar') => `${fam === 'Cairo' ? '900 ' : ''}${px}px '${fam}'`;
function text(s, x, y, px, col, o = {}) { g.font = font(px, o.fam); const mw = o.max ?? 920, w0 = g.measureText(s).width; if (w0 > mw) { px = Math.floor(px * mw / w0); g.font = font(px, o.fam); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.lineJoin = 'round';
  if (o.stroke !== 0) { g.lineWidth = o.stroke ?? 12; g.strokeStyle = o.sc ?? '#000'; g.strokeText(s, x, y); } g.fillStyle = col; g.fillText(s, x, y); }
function panel(y, h, a = 1) { g.fillStyle = `rgba(0,0,0,${.6 * a})`; g.beginPath(); g.roundRect(60, y - h / 2, 960, h, 36); g.fill(); }
const fade = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const events = []; const fired = new Set(); const fire = (k, t) => { if (!fired.has(k)) { fired.add(k); events.push({ t, kind: k }); } };
let f = 0;
window.frame = function () {
  const t = f / FPS; f++;
  g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
  if (t < T.round2) {
    // ---- round 1: two equal grey squares on a dark half and a light half ----
    const flat = fade(t, T.flat1, T.flat1 + 1.2);
    const dark = mixHex('#0d0d0d', '#8a8a8a', flat * 0 + 0), light = '#f2f2f2';
    g.fillStyle = mixHex('#0d0d0d', '#5a5a5a', flat); g.fillRect(0, 560, 540, 760);
    g.fillStyle = mixHex('#f2f2f2', '#5a5a5a', flat); g.fillRect(540, 560, 540, 760);
    const bridge = fade(t, T.bridge, T.bridge + 1.0);
    if (bridge > 0) { fire('switch', t); g.fillStyle = GRAY; g.fillRect(270, 905, 540 * bridge, 70); }
    g.fillStyle = GRAY; g.fillRect(170, 840, 200, 200); g.fillRect(710, 840, 200, 200);
    if (bridge === 0) { text('1', 270, 1100, 80, '#fff', { fam: 'Cairo', stroke: 10 }); text('2', 810, 1100, 80, '#fff', { fam: 'Cairo', stroke: 10 }); }
    // question / countdown
    if (t < T.bridge) { panel(1460, 170); text(EP.q1, 540, 1460, 84, '#ffe14d', { stroke: 0 });
      if (t > T.think) { const n = Math.max(1, Math.ceil(T.bridge - t)); text(String(n), 540, 1610, 90, '#fff', { fam: 'Cairo', stroke: 10 }); } }
    else if (t < T.flat1 + .3) { panel(1460, 170); text(EP.bridgeLine, 540, 1460, 76, '#fff', { stroke: 0 }); }
    else { panel(1460, 190); text(EP.same1, 540, 1430, 86, '#7dff9a', { stroke: 0 }); text(EP.same1b, 540, 1500, 48, '#fff', { stroke: 0 }); }
  } else {
    // ---- round 2: one uniform grey bar across a dark→light gradient ----
    const flat = fade(t, T.flat2, T.flat2 + 1.4);
    const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, mixHex('#050505', '#5a5a5a', flat)); gr.addColorStop(1, mixHex('#fafafa', '#5a5a5a', flat));
    g.fillStyle = gr; g.fillRect(0, 560, W, 760);
    g.fillStyle = GRAY; g.fillRect(60, 900, 960, 90);
    if (flat > 0) fire('reveal', t);
    if (t < T.flat2) { panel(1460, 190); text(EP.q2, 540, 1430, 80, '#ffe14d', { stroke: 0 }); text(EP.q2b, 540, 1500, 48, '#fff', { stroke: 0 }); }
    else if (t < T.explain) { panel(1460, 190); text(EP.same2, 540, 1430, 80, '#7dff9a', { stroke: 0 }); text(EP.same2b, 540, 1500, 48, '#fff', { stroke: 0 }); }
    else { panel(1430, 230); text(EP.explain1, 540, 1385, 54, '#fff', { stroke: 0 }); text(EP.explain2, 540, 1470, 54, '#7fe3ff', { stroke: 0 }); }
    if (t > T.cta) { fire('cta', t); const a = fade(t, T.cta, T.cta + .35); g.globalAlpha = a; panel(1660, 170); text(EP.cta1, 540, 1630, 70, '#fff', { stroke: 0 }); text(EP.cta2, 540, 1700, 44, '#ffb3c6', { stroke: 0 }); g.globalAlpha = 1; }
  }
  // header (always on, first frame included)
  panel(300, 250); text(EP.title, 540, 240, 70, '#fff', { stroke: 0 });
  g.fillStyle = '#ff3d5a'; g.beginPath(); g.roundRect(435, 290, 210, 60, 30); g.fill(); text(EP.partLabel, 540, 321, 42, '#fff', { fam: 'Cairo', stroke: 0 });
  text(t < T.round2 ? EP.hook1 : EP.hook2, 540, 395, 56, '#ffe14d', { stroke: 0 });
  return { t, n: t < T.round2 ? 'r1' : 'r2', state: 'run' };
};
window.getEvents = () => events;
window.getInfo = () => ({ finaleT: T.end - 3.6, end: T.end });
</script></body></html>
