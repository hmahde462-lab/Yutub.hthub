  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.lineJoin = 'round';
  if (o.stroke !== 0) { g.lineWidth = o.stroke ?? 12; g.strokeStyle = o.sc ?? '#000'; g.strokeText(s, x, y); } g.fillStyle = col; g.fillText(s, x, y); }

function scint(cx, cy, n, cell, line, rot, bg, ln, dot, zoom) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(zoom, zoom); const S = n * cell;
  const M = S * .6; g.fillStyle = bg; g.fillRect(-S / 2 - M, -S / 2 - M, S + 2 * M, S + 2 * M);
  g.fillStyle = ln; for (let i = -4; i <= n + 4; i++) { const p = -S / 2 + i * cell; g.fillRect(p - line / 2, -S / 2 - M, line, S + 2 * M); g.fillRect(-S / 2 - M, p - line / 2, S + 2 * M, line); }
  g.fillStyle = dot; for (let i = -4; i <= n + 4; i++) for (let j = -4; j <= n + 4; j++) { g.beginPath(); g.arc(-S / 2 + i * cell, -S / 2 + j * cell, line * .75, 0, TAU); g.fill(); }

  return { t, n: 'x', state: 'run' };
};
