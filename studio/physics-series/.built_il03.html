<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script>
// "Equal lines" — Müller-Lyer then Ponzo, each followed by a reveal.
const EP = {"id":"il03","template":"illusion_lines.html","title":"خدعة بصرية","partLabel":"الجزء 3","hook1":"أي خط أطول؟ جاوب قبل العد","hook2":"الجولة الثانية... أصعب","q1":"1 لو 2... أيهم أطول؟","bridgeLine":"خلّي نشيل الأطراف...","same1":"نفس الطول بالضبط!","same1b":"الأطراف هي اللي تخدعك","q2":"أي شريط أحمر أطول؟","q2b":"الفوگاني لو الجوّاني؟","same2":"ولا واحد... نفس الطول!","same2b":"السكة خلّت دماغك يحسب بعد","explain1":"دماغك يقدّر الطول من الزوايا والعمق","explain2":"فيكبّر ويصغّر الأشياء بدون ما تحس","cta1":"انخدعت؟ اكتب نعم لو لا","cta2":"الجزء 4 جاي... أصعب بكثير 👁️","timeline":{"think":3,"bridge":7,"flat1":9,"round2":12.5,"think2":14.5,"flat2":18,"explain":21.5,"cta":24.5,"end":28}}; const T = EP.timeline; const W = 1080, H = 1920, FPS = 60;
const g = document.getElementById('cv').getContext('2d');
const GRAY = '#8a8a8a';
const font = (px, fam = 'Lalezar') => `${fam === 'Cairo' ? '900 ' : ''}${px}px '${fam}'`;
function text(s, x, y, px, col, o = {}) { g.font = font(px, o.fam); const mw = o.max ?? 920, w0 = g.measureText(s).width; if (w0 > mw) { px = Math.floor(px * mw / w0); g.font = font(px, o.fam); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.lineJoin = 'round';
  if (o.stroke !== 0) { g.lineWidth = o.stroke ?? 12; g.strokeStyle = o.sc ?? '#000'; g.strokeText(s, x, y); } g.fillStyle = col; g.fillText(s, x, y); }
function panel(y, h, a = 1) { g.fillStyle = `rgba(0,0,0,${.6 * a})`; g.beginPath(); g.roundRect(60, y - h / 2, 960, h, 36); g.fill(); }
const fade = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const events = []; const fired = new Set(); const fire = (k, t) => { if (!fired.has(k)) { fired.add(k); events.push({ t, kind: k }); } };

let f = 0;
const ease = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
function fins(x, y, dir, a) { // dir=+1 fins open outward (>—<), -1 arrowheads (<—>)
  g.globalAlpha = a; g.strokeStyle = '#fff'; g.lineWidth = 14; g.lineCap = 'round';
  for (const [ex, sx] of [[x[0], -1], [x[1], 1]]) { const L = 80, dx = L * .7 * sx * dir;
    g.beginPath(); g.moveTo(ex + dx, y - L * .7); g.lineTo(ex, y); g.lineTo(ex + dx, y + L * .7); g.stroke(); }
  g.globalAlpha = 1; }
function dashed(x, y0, y1, a) { g.globalAlpha = a; g.strokeStyle = '#7dff9a'; g.lineWidth = 6; g.setLineDash([22, 16]); g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); g.setLineDash([]); g.globalAlpha = 1; }
window.frame = function () {
  const t = f / FPS; f++;
  g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1b2433'; g.fillRect(0, 560, W, 760);
  if (t < T.round2) {
    const X = [290, 790], Y1 = 800, Y2 = 1080;
    const off = 1 - ease(fade(t, T.bridge, T.bridge + 1.0)); if (off < 1) fire('switch', t);
    g.strokeStyle = '#fff'; g.lineWidth = 14; g.lineCap = 'round';
    for (const y of [Y1, Y2]) { g.beginPath(); g.moveTo(X[0], y); g.lineTo(X[1], y); g.stroke(); }
    fins(X, Y1, 1, off); fins(X, Y2, -1, off);
    if (off > .5) { text('1', 140, Y1, 80, '#ffe14d', { fam: 'Cairo', stroke: 10 }); text('2', 140, Y2, 80, '#ffe14d', { fam: 'Cairo', stroke: 10 }); }
    const gd = ease(fade(t, T.bridge + 1.0, T.flat1)); if (gd > 0) { dashed(X[0], 650, 650 + 580 * gd, 1); dashed(X[1], 650, 650 + 580 * gd, 1); }
    if (t >= T.flat1) fire('reveal', t);
    if (t < T.bridge) { panel(1460, 170); text(EP.q1, 540, 1460, 84, '#ffe14d', { stroke: 0 });
      if (t > T.think) { const n = Math.max(1, Math.ceil(T.bridge - t)); text(String(n), 540, 1610, 90, '#fff', { fam: 'Cairo', stroke: 10 }); } }
    else if (t < T.flat1) { panel(1460, 170); text(EP.bridgeLine, 540, 1460, 76, '#fff', { stroke: 0 }); }
    else { panel(1460, 190); text(EP.same1, 540, 1430, 86, '#7dff9a', { stroke: 0 }); text(EP.same1b, 540, 1500, 48, '#fff', { stroke: 0 }); }
  } else {
    // Ponzo: converging rails, two equal red bars
    const rv = ease(fade(t, T.flat2, T.flat2 + 1.6)), trackA = 1 - ease(fade(t, T.flat2, T.flat2 + .8));
    g.globalAlpha = trackA;
    const top = 590, bot = 1320, cx = 540;
    for (let k = 0; k < 14; k++) { const p = k / 13, yy = top + (bot - top) * Math.pow(p, 1.6), half = 70 + (400 - 70) * Math.pow(p, 1.6);
      g.strokeStyle = '#7a5a3a'; g.lineWidth = 6 + 14 * p; g.beginPath(); g.moveTo(cx - half * 1.15, yy); g.lineTo(cx + half * 1.15, yy); g.stroke(); }
    g.strokeStyle = '#c9c9c9'; g.lineWidth = 12; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * 70, top); g.lineTo(cx + s * 400, bot); g.stroke(); }
    g.globalAlpha = 1;
    const BW = 240, yTop = 760 + (1110 - 760) * rv, yBot = 1190;
    g.fillStyle = '#ff3d5a'; g.strokeStyle = '#000'; g.lineWidth = 5;
    for (const y of [yTop, yBot]) { g.beginPath(); g.roundRect(cx - BW / 2, y - 22, BW, 44, 8); g.fill(); g.stroke(); }
    if (rv > .95) { dashed(cx - BW / 2, 1040, 1260, 1); dashed(cx + BW / 2, 1040, 1260, 1); }
    if (t > T.flat2) fire('reveal2', t);
    if (t < T.flat2) { panel(1460, 190); text(EP.q2, 540, 1430, 80, '#ffe14d', { stroke: 0 }); text(EP.q2b, 540, 1500, 48, '#fff', { stroke: 0 });
      if (t > T.think2) { const n = Math.max(1, Math.ceil(T.flat2 - t)); text(String(n), 540, 1640, 90, '#fff', { fam: 'Cairo', stroke: 10 }); } }
    else if (t < T.explain) { panel(1460, 190); text(EP.same2, 540, 1430, 80, '#7dff9a', { stroke: 0 }); text(EP.same2b, 540, 1500, 48, '#fff', { stroke: 0 }); }
    else { panel(1430, 230); text(EP.explain1, 540, 1385, 54, '#fff', { stroke: 0 }); text(EP.explain2, 540, 1470, 54, '#7fe3ff', { stroke: 0 }); }
    if (t > T.cta) { fire('cta', t); const a = fade(t, T.cta, T.cta + .35); g.globalAlpha = a; panel(1660, 170); text(EP.cta1, 540, 1630, 70, '#fff', { stroke: 0 }); text(EP.cta2, 540, 1700, 44, '#ffb3c6', { stroke: 0 }); g.globalAlpha = 1; }
  }
  panel(300, 250); text(EP.title, 540, 240, 70, '#fff', { stroke: 0 });
  g.fillStyle = '#ff3d5a'; g.beginPath(); g.roundRect(435, 290, 210, 60, 30); g.fill(); text(EP.partLabel, 540, 321, 42, '#fff', { fam: 'Cairo', stroke: 0 });
  text(t < T.round2 ? EP.hook1 : EP.hook2, 540, 395, 56, '#ffe14d', { stroke: 0 });
  return { t, n: t < T.round2 ? 'r1' : 'r2', state: 'run' };
};
window.getEvents = () => events;
window.getInfo = () => ({ finaleT: T.end - 3.6, end: T.end });
</script></body></html>
