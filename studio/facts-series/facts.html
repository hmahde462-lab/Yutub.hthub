<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script>
// "3 strange facts about the people of <country>": intro -> fact 1..3 -> outro, timed to the narration segments.
const EP = __EP__; const TAU = Math.PI * 2, W = 1080, H = 1920;
const g = document.getElementById('cv').getContext('2d');
const GAP = .45, START = .35; const T = []; let t0 = START; for (const d of EP.durs) { T.push([t0, t0 + d]); t0 += d + GAP; }
const TOTAL = t0 + .9; window.getTotal = () => TOTAL;
const HUE = [210, 260, 330, 15, 40, 160, 190][EP.n % 7];
const font = (px, fam = 'Lalezar') => `${fam === 'Cairo' ? '900 ' : ''}${px}px '${fam}'`;
function text(s, x, y, px, col, o = {}) { g.font = font(px, o.fam); const mw = o.max ?? 980, w0 = g.measureText(s).width; if (w0 > mw) { px = Math.floor(px * mw / w0); g.font = font(px, o.fam); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.lineJoin = 'round'; if (o.stroke !== 0) { g.lineWidth = o.stroke ?? 9; g.strokeStyle = '#000'; g.strokeText(s, x, y); } g.fillStyle = col; g.fillText(s, x, y); }
function emoji(s, x, y, px) { g.font = `${px}px 'Noto Color Emoji'`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'ltr'; g.fillText(s, x, y); }
function wrap(s, px, maxW) { g.font = font(px, 'Cairo'); const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }
const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
const pop = k => { k = Math.min(1, Math.max(0, k)); return k < .7 ? ease(k / .7) * 1.12 : 1.12 - .12 * ease((k - .7) / .3); };
function background(t) { const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, `hsl(${HUE},55%,22%)`); bg.addColorStop(.6, `hsl(${HUE},60%,10%)`); bg.addColorStop(1, '#05060c'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let k = 0; k < 26; k++) { const ph = (t * .03 + k * .0385) % 1, x = (k * 397) % W, y = H - ph * (H + 200); g.globalAlpha = .08 + .06 * Math.sin(k + t); g.fillStyle = `hsl(${HUE + 40},90%,70%)`; g.beginPath(); g.arc(x, y, 6 + (k % 5) * 5, 0, TAU); g.fill(); } g.globalAlpha = 1; }
function header() { text(`معلومات غريبة 🌍 · الحلقة ${EP.n}`, 540, 150, 46, '#ffd23b', { stroke: 7 }); }
function dots(active) { for (let i = 0; i < 3; i++) { const x = 540 + (i - 1) * 90; g.fillStyle = i <= active ? '#ffd23b' : 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(x, 1700, i === active ? 22 : 16, 0, TAU); g.fill(); } }
window.renderAt = function (t) {
  background(t); header();
  const [i0, i1] = T[0];
  if (t < T[1][0] - GAP / 2) { const k = (t - i0) / .5;
    const bob = Math.sin(t * 3) * 14; emoji(EP.f, 540, 640 + bob, 330 * pop(k));
    text('3 معلومات غريبة', 540, 980, 110 * Math.min(1, pop(k - .2)), '#fff', { stroke: 12 });
    text(`عن سكان ${EP.c}`, 540, 1120, 96 * Math.min(1, pop(k - .45)), '#ffd23b', { stroke: 12 });
    if (t > i0 + 1.0) { g.globalAlpha = ease((t - i0 - 1.0) / .4); text('الثالثة راح تصدمك 🤯', 540, 1290, 66, '#7dff9a', { stroke: 9 }); g.globalAlpha = 1; }
    return; }
  for (let i = 0; i < 3; i++) { const [a, b] = T[i + 1], end = i < 2 ? T[i + 2][0] - GAP / 2 : T[4][0] - GAP / 2;
    if (t < end) { const k = (t - a + GAP / 2) / .45; const [fact, em] = EP.x[i];
      emoji(EP.f, 150, 300, 110);
      g.save(); g.translate(540, 360); const s = pop(k); g.scale(s, s); g.fillStyle = '#ffd23b'; g.beginPath(); g.arc(0, 0, 95, 0, TAU); g.fill(); g.strokeStyle = '#000'; g.lineWidth = 8; g.stroke(); text(String(i + 1), 0, 8, 130, '#111', { stroke: 0 }); g.restore();
      emoji(em, 540, 700 + Math.sin(t * 2.4) * 16, 260 * pop(k - .15));
      const lines = wrap(fact, 66, 900), lh = 98, y0 = 1180 - (lines.length - 1) * lh / 2;
      const box = Math.max(...lines.map(l => (g.font = font(66, 'Cairo'), g.measureText(l).width))) + 110;
      g.globalAlpha = ease((t - a + .2) / .35); g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(540 - box / 2, y0 - 85, box, lines.length * lh + 70, 40); g.fill();
      lines.forEach((l, j) => text(l, 540, y0 + j * lh, 66, '#fff', { fam: 'Cairo', stroke: 7, max: 940 })); g.globalAlpha = 1;
      dots(i); return; } }
  const [o0] = T[4], k = (t - o0 + GAP / 2) / .5;
  emoji(EP.f, 540, 560 + Math.sin(t * 3) * 12, 240 * pop(k));
  text('إنت من وين؟ 👇', 540, 900, 100 * Math.min(1, pop(k - .15)), '#fff', { stroke: 12 });
  text('اكتب دولتك بالتعليقات', 540, 1040, 76, '#ffd23b', { stroke: 10 });
  text('وراح نسويلها حلقة 🔥', 540, 1150, 76, '#ffd23b', { stroke: 10 });
  g.globalAlpha = ease((t - o0 - .6) / .4); text('اشترك حتى ما تفوتك الحلقة الجاية 🔔', 540, 1400, 56, '#7dff9a', { stroke: 9 }); g.globalAlpha = 1; };
window.timeline = () => ({ total: TOTAL, segs: T, gap: GAP });
</script></body></html>
