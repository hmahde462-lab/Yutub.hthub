<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script src="duel_engine.js"></script>
<script>
// One country-vs-country ball fight, vertical 9:16. Timeline: pre (hook + VS) -> fight -> hold -> end card.
const EP = __EP__; const TAU = Math.PI * 2, W = 1080, H = 1920;
const g = document.getElementById('cv').getContext('2d');
</script>
<script src="_helpers.js"></script>
<script>
const PRE = 2.4, HOLD = 2.4, END = 3.6;
const FIGHT0 = PRE, FIGHT1 = PRE + EP.dur + HOLD, TOTAL = FIGHT1 + END;
window.getTotal = () => TOTAL;
const CX = 540, CY = 1010;
const simCfg = () => Object.assign({ seed: EP.seed, dmgScale: EP.ds, cx: CX, cy: CY, r: 66, maxTime: 60, spawnEvery: 1.5, fighters: [{ name: EP.a }, { name: EP.b }] }, EP.arena);
const winner = () => EP.winner === 0 ? EP.a : EP.b;
const colOf = n => FLAG[n].col === '#ffffff' ? '#f2f2f2' : FLAG[n].col;

let sim = null, parts = [], pops = [], lastEv = 0, shake = 0;
function simAt(local) { if (!sim || sim.t > local + 1e-6) { sim = new DuelSim(simCfg()); lastEv = 0; parts = []; pops = []; }
  while (sim.t < local - 1e-9) sim.stepFrame(); return sim; }

function background(t) { const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#16204a'); bg.addColorStop(.55, '#0b1028'); bg.addColorStop(1, '#05060f'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // two team-coloured glows, top-left and top-right
  for (const [n, x] of [[EP.a, 120], [EP.b, 960]]) { const rg = g.createRadialGradient(x, 300, 10, x, 300, 520); rg.addColorStop(0, colOf(n) + '55'); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, 900); } }
function header() { text(`معركة الأعلام 🚩 · الحلقة ${EP.n}`, 540, 150, 44, '#ffd23b', { stroke: 7 }); }
function hpBars(s) { const A = s.balls[0], B = s.balls[1];
  for (const [b, nm, x, dir] of [[A, EP.a, 40, 1], [B, EP.b, 560, -1]]) { const k = Math.max(0, b.hp) / 100, col = colOf(nm);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(x, 230, 480, 120, 26); g.fill();
    flagBall(nm, dir > 0 ? x + 58 : x + 422, 290, 40);
    text(nm, dir > 0 ? x + 230 : x + 250, 266, 38, '#fff', { fam: 'Cairo', stroke: 6, max: 230 });
    text(String(Math.ceil(Math.max(0, b.hp))), dir > 0 ? x + 425 : x + 55, 266, 36, '#ffd23b', { fam: 'Cairo', stroke: 6 });
    g.fillStyle = 'rgba(255,255,255,.15)'; g.beginPath(); g.roundRect(dir > 0 ? x + 110 : x + 20, 308, 350, 20, 10); g.fill();
    const bw = 350 * k; g.fillStyle = col; g.beginPath(); g.roundRect(dir > 0 ? x + 110 : x + 370 - bw, 308, bw + .01, 20, 10); g.fill();
    if (b.w) text(ICON[b.w.type], dir > 0 ? x + 470 : x + 10, 230, 40, '#fff', { stroke: 0 }); }
  g.save(); g.translate(540, 290); text('VS', 0, 0, 46, '#ff3d5a', { stroke: 8 }); g.restore(); }

function fightScene(local, t) { const s = simAt(local);
  for (; lastEv < s.events.length; lastEv++) { const e = s.events[lastEv];
    if (e.kind === 'hit' && e.w !== 'bump') { pops.push({ x: e.x, y: e.y, s: '-' + e.v, col: '#ff4b4b', t0: local }); if (e.v >= 15) shake = Math.max(shake, .6); }
    if (e.kind === 'heal') pops.push({ x: e.x, y: e.y - 60, s: '+' + e.v, col: '#5dff8a', t0: local });
    if (e.kind === 'ko') { shake = 1; const col = colOf(e.who === 0 ? EP.a : EP.b); for (let k = 0; k < 46; k++) { const a = k / 46 * TAU, sp = 220 + (k * 37 % 420); parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.2, col, r: 9 }); } } }
  const sx = Math.sin(t * 91) * 12 * shake, sy = Math.cos(t * 73) * 10 * shake; shake *= .9;
  g.save(); g.translate(sx, sy);
  g.fillStyle = '#1a2140'; arenaPath(s, s.R); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 10; g.lineJoin = 'round'; arenaPath(s, s.R); g.stroke();
  for (const it of s.items) { const age = local - it.born; g.globalAlpha = Math.min(1, age / .25); g.fillStyle = 'rgba(255,255,255,.12)'; g.strokeStyle = '#ffe14d'; g.lineWidth = 4; g.beginPath(); g.arc(it.x, it.y, 36, 0, TAU); g.fill(); g.stroke(); text(ICON[it.type], it.x, it.y + 3, 40, '#fff', { stroke: 0 }); g.globalAlpha = 1; }
  for (const bm of s.bombs) text('💣', bm.x, bm.y, 52, '#fff', { stroke: 0 });
  for (const b of s.balls) { if (!b.alive) continue; const nm = b.i === 0 ? EP.a : EP.b, foe = s.balls[1 - b.i];
    drawWeapon(s, b); flagBall(nm, b.x, b.y, b.r, 26); if (b.flash > .5) { g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.fill(); }
    eyes(b.x, b.y, b.r, Math.atan2(foe.y - b.y, foe.x - b.x), !!b.w);
    if (b.shield > 0) { g.strokeStyle = 'rgba(120,200,255,.85)'; g.lineWidth = 7; g.beginPath(); g.arc(b.x, b.y, b.r + 13, 0, TAU); g.stroke(); }
    text(nm, b.x, b.y - b.r - 26, 32, '#fff', { fam: 'Cairo', stroke: 7 });
    if (s.state === 'finale' && b.i === s.winner) text('👑', b.x, b.y - b.r - 72, 60, '#fff', { stroke: 0 }); }
  for (const p of parts) { p.x += p.vx / 30; p.y += p.vy / 30; p.vx *= .93; p.vy *= .93; p.life -= 1 / 30; g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); } g.globalAlpha = 1; parts = parts.filter(p => p.life > 0);
  for (const p of pops) { const k = (local - p.t0) / .8; g.globalAlpha = Math.max(0, 1 - k); text(p.s, p.x, p.y - 44 - k * 64, 46, p.col, { fam: 'Cairo', stroke: 7 }); } g.globalAlpha = 1; pops = pops.filter(p => local - p.t0 < .8);
  g.restore();
  hpBars(s);
  if (s.state !== 'finale') text('منو يفوز؟ اكتب توقعك بالتعليقات 👇', 540, 1590, 44, '#7dff9a', { stroke: 8 });
  else { const a = Math.min(1, (local - s.finaleT) / .3), w = winner(); g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,.65)'; g.beginPath(); g.roundRect(140, 1530, 800, 200, 36); g.fill();
    text('فاز! 🏆', 540, 1585, 60, '#fff', { stroke: 9 }); text(w, 540, 1675, 92, colOf(w), { stroke: 12 }); g.globalAlpha = 1; } }

window.renderAt = function (t) {
  background(t); header();
  if (t < FIGHT0) { const local = t, a = Math.min(1, .45 + local / .4);
    text(EP.hook, 540, 400, 62, '#fff', { stroke: 10, max: 980 });
    flagBall(EP.a, 270 - (1 - a) * 300, 980, 165, 40); eyes(270 - (1 - a) * 300, 980, 165, 0, true);
    flagBall(EP.b, 810 + (1 - a) * 300, 980, 165, 40); eyes(810 + (1 - a) * 300, 980, 165, Math.PI, true);
    text(EP.a, 270, 1215, 70, '#fff', { fam: 'Cairo', stroke: 10, max: 470 }); text(EP.b, 810, 1215, 70, '#fff', { fam: 'Cairo', stroke: 10, max: 470 });
    g.save(); g.translate(540, 980); const sc = Math.min(1.15, a * 1.15); g.scale(sc, sc); text('VS', 0, 0, 150, '#ff3d5a', { stroke: 14 }); g.restore();
    text('اختار دولتك قبل لا تبدي! 👇', 540, 1450, 52, '#7dff9a', { stroke: 9 }); return; }
  if (t < FIGHT1) { fightScene(t - FIGHT0, t); return; }
  const local = t - FIGHT1, a = Math.min(1, local / .4), w = winner();
  for (let k = 0; k < 70; k++) { const ph = (local * .35 + k * .0143) % 1; g.fillStyle = ['#ffd23b', '#ff4b6e', '#4f9dff', '#3fd17a'][k % 4]; g.fillRect((k * 151) % W, ph * H, 14, 24); }
  g.globalAlpha = a; text('👑', 540, 560, 130, '#fff', { stroke: 0 }); flagBall(w, 540, 860, 230 * a, 60); eyes(540, 860, 230 * a, Math.PI / 2, false);
  text('الفايز 🏆', 540, 1150, 70, '#fff', { stroke: 10 }); text(w, 540, 1250, 110, colOf(w), { stroke: 14, max: 1000 });
  text('فازت دولتك؟ اكتبها بالتعليقات 👇', 540, 1390, 52, '#fff', { stroke: 9 });
  text('اشترك حتى تشوف المعركة الجاية 🔥', 540, 1490, 50, '#7dff9a', { stroke: 9 }); g.globalAlpha = 1;
};
window.allEvents = function () { const out = [{ t: .15, kind: 'vs' }, { t: FIGHT1, kind: 'champion' }];
  const s = new DuelSim(simCfg()); while (s.t < EP.dur + HOLD) s.stepFrame(); s.events.forEach(e => out.push(Object.assign({}, e, { t: FIGHT0 + e.t })));
  return { total: TOTAL, events: out.sort((a, b) => a.t - b.t) }; };
</script></body></html>
