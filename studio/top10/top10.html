<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}</style></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<script src="chars.js"></script>
<script>
const CFG = __CFG__;
const FPS = CFG.fps, W = 1080, H = 1920, GY = 1265;
const g = document.getElementById('cv').getContext('2d');
const events = [], fired = new Set();
const fire = (k, t) => { if (!fired.has(k)) { fired.add(k); events.push({ t: +t.toFixed(3), kind: k.split('#')[0] }); } };
function getEvents() { return events; }
let FI = 0;
const R0 = rng(7); const DUST = Array.from({ length: 60 }, () => [R0() * W, R0() * H, R0() * TAU, .3 + R0() * .7]);

// ---------- generic drawing ----------
function grad(top, bot) { g.setTransform(1, 0, 0, 1, 0, 0); const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function vignette() { g.setTransform(1, 0, 0, 1, 0, 0); const gr = g.createRadialGradient(W / 2, 880, 300, W / 2, 900, 1250); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function ground(col, y = GY) { g.fillStyle = col; g.fillRect(-200, y, W + 400, H); g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 5; g.beginPath(); g.moveTo(-200, y); g.lineTo(W + 200, y); g.stroke(); }
function txt(s, x, y, size, col, font = 'Lalezar', stroke = 0, sc = '#000', align = 'center', maxW = 1000) {
  g.font = `${font === 'Cairo' ? 900 : 400} ${size}px '${font}'`; let w = g.measureText(s).width;
  if (w > maxW) { size = size * maxW / w; g.font = `${font === 'Cairo' ? 900 : 400} ${size}px '${font}'`; }
  g.textAlign = align; g.textBaseline = 'middle'; g.direction = /^[0-9+,\- ·]+$/.test(s) ? 'ltr' : 'rtl';
  if (stroke) { g.lineJoin = 'round'; g.strokeStyle = sc; g.lineWidth = stroke; g.strokeText(s, x, y); }
  g.fillStyle = col; g.fillText(s, x, y);
}
function chip(s, x, y, size, bg, fg, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `900 ${size}px 'Cairo'`; const w = g.measureText(s).width + size * 1.2;
  g.fillStyle = bg; g.beginPath(); g.roundRect(x - w / 2, y - size * .85, w, size * 1.7, size * .5); g.fill(); g.strokeStyle = '#000'; g.lineWidth = 4; g.stroke(); txt(s, x, y + 2, size, fg, 'Cairo'); g.restore(); }
function pop(u, a, d = .35) { const k = seg(u, a, a + d); if (k <= 0) return 0; return k < 1 ? 1 + .25 * Math.sin(k * Math.PI) * (1 - k) + (easeOut(k) - 1) * 1 : 1; }
function person(x, y, s, col, a = 1) { g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.arc(0, -46, 11, 0, TAU); g.fill(); g.beginPath(); g.moveTo(0, -34); g.lineTo(0, -12); g.moveTo(-12, -28); g.lineTo(12, -28); g.moveTo(0, -12); g.lineTo(-9, 0); g.moveTo(0, -12); g.lineTo(9, 0); g.stroke(); g.restore(); }
function skull(x, y, r, a = 1) { g.save(); g.globalAlpha *= a; g.fillStyle = '#efe8d8'; g.strokeStyle = '#2a2219'; g.lineWidth = Math.max(2, r * .12);
  g.beginPath(); g.arc(x, y, r, Math.PI * .85, Math.PI * 2.15); g.lineTo(x + r * .55, y + r * .95); g.lineTo(x - r * .55, y + r * .95); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#2a2219'; for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(x + sd * r * .38, y + r * .05, r * .24, r * .28, 0, 0, TAU); g.fill(); }
  g.beginPath(); g.moveTo(x, y + r * .38); g.lineTo(x - r * .1, y + r * .58); g.lineTo(x + r * .1, y + r * .58); g.fill(); g.restore(); }
function flash(u, a, col = '255,255,255', d = .35) { const k = seg(u, a, a + d); if (k > 0 && k < 1) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(${col},${.7 * (1 - k)})`; g.fillRect(0, 0, W, H); } }
function shake(u, a, amp = 14, d = .4) { const k = seg(u, a, a + d); if (k > 0 && k < 1) { const m = amp * (1 - k); g.translate(Math.sin(FI * 2.1) * m, Math.cos(FI * 2.7) * m); } }
function counter(u, a, d, from, to) { const k = easeOut(seg(u, a, a + d)); return Math.round(lerp(from, to, k)); }
const fmt = n => n.toLocaleString('en-US');
function dust(t, col = '255,230,200') { for (const [x, y, ph, s] of DUST) { const yy = (y - t * 30 * s) % H; const a = .25 + .25 * Math.sin(t * 2 + ph); g.fillStyle = `rgba(${col},${a * s})`; g.beginPath(); g.arc((x + Math.sin(t + ph) * 20), yy < 0 ? yy + H : yy, 2.5 * s + 1, 0, TAU); g.fill(); } }
function talk(t, on) { return on ? clamp(.3 + .7 * Math.abs(Math.sin(t * 12) * Math.sin(t * 7.1 + 1))) : 0; }

// ---------- headwear (drawn in head-local space, head radius R) ----------
const HATS = {
  vlad(g, R) { g.fillStyle = '#7a1414'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-R * .85, -R * .55); g.lineTo(-R * .7, -R * 1.55); g.quadraticCurveTo(0, -R * 1.85, R * .7, -R * 1.55); g.lineTo(R * .85, -R * .55); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#3b2616'; g.beginPath(); g.ellipse(0, -R * .6, R * .98, R * .26, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#f2c230'; g.beginPath(); g.arc(0, -R * 1.1, 9, 0, TAU); g.fill(); g.stroke(); for (const sd of [-1, 1]) { g.fillStyle = '#fff'; g.beginPath(); g.arc(sd * 22, -R * 1.05, 5, 0, TAU); g.fill(); }
    g.fillStyle = INK; g.beginPath(); g.moveTo(0, 12); g.quadraticCurveTo(-22, 8, -30, 34); g.quadraticCurveTo(-18, 18, 0, 18); g.quadraticCurveTo(18, 18, 30, 34); g.quadraticCurveTo(22, 8, 0, 12); g.fill(); },
  ivan(g, R) { g.fillStyle = '#e0a82e'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.arc(0, -R * .7, R * .78, Math.PI, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#a06d10'; g.lineWidth = 3; for (const a of [-.6, -.2, .2, .6]) { g.beginPath(); g.moveTo(Math.sin(a) * R * .78, -R * .7 - Math.cos(a) * R * .74); g.lineTo(Math.sin(a) * R * .3, -R * .7); g.stroke(); }
    g.fillStyle = '#3b2616'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.ellipse(0, -R * .68, R * .95, R * .22, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#e8322b'; g.beginPath(); g.arc(0, -R * 1.55, 9, 0, TAU); g.fill(); g.stroke(); },
  cap(color, band) { return (g, R) => { g.fillStyle = color; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.ellipse(0, -R * .78, R * 1.0, R * .42, 0, Math.PI, TAU); g.lineTo(R * .85, -R * .62); g.lineTo(-R * .85, -R * .62); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = band; g.fillRect(-R * .85, -R * .74, R * 1.7, 12); g.fillStyle = '#111'; g.beginPath(); g.ellipse(R * .15, -R * .58, R * .75, R * .16, 0, 0, Math.PI); g.fill(); g.fillStyle = '#f2c230'; g.beginPath(); g.arc(0, -R * 1.0, 8, 0, TAU); g.fill(); g.stroke(); }; },
  crown(g, R) { g.fillStyle = '#f2c230'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-R * .75, -R * .7); for (let i = 0; i <= 4; i++) { const x = -R * .75 + i * R * .375; g.lineTo(x, -R * (i % 2 ? 1.05 : 1.45)); } g.lineTo(R * .75, -R * .7); g.closePath(); g.fill(); g.stroke();
    for (const [x, c] of [[-R * .38, '#e8322b'], [0, '#2f6fd1'], [R * .38, '#e8322b']]) { g.fillStyle = c; g.beginPath(); g.arc(x, -R * .85, 6, 0, TAU); g.fill(); } },
  mongol(g, R) { g.fillStyle = '#6d6a62'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-R * .9, -R * .5); g.quadraticCurveTo(-R * .8, -R * 1.5, 0, -R * 1.8); g.quadraticCurveTo(R * .8, -R * 1.5, R * .9, -R * .5); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(0, -R * 1.8); g.lineTo(0, -R * 2.3); g.stroke(); g.fillStyle = '#b22'; g.beginPath(); g.moveTo(0, -R * 2.25); g.quadraticCurveTo(14, -R * 2.0, 6, -R * 1.85); g.quadraticCurveTo(-8, -R * 2.0, 0, -R * 2.25); g.fill();
    g.fillStyle = '#5a3a1e'; g.beginPath(); g.ellipse(0, -R * .52, R * 1.02, R * .2, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = INK; for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(sd * 6, 14); g.quadraticCurveTo(sd * 26, 14, sd * 28, 44); g.lineTo(sd * 22, 44); g.quadraticCurveTo(sd * 20, 22, sd * 4, 20); g.fill(); } },
  polpot(g, R) { g.fillStyle = INK; g.beginPath(); g.arc(0, -R * .2, R * 1.0, Math.PI * 1.08, Math.PI * 1.92); g.quadraticCurveTo(0, -R * .7, -R * .92, -R * .55); g.fill(); },
  mao(g, R) { g.fillStyle = INK; g.beginPath(); g.arc(0, -R * .05, R * 1.02, Math.PI * 1.05, Math.PI * 1.95); g.quadraticCurveTo(R * .3, -R * .95, -R * .2, -R * .82); g.quadraticCurveTo(-R * .6, -R * .75, -R * .98, -R * .3); g.fill();
    g.beginPath(); g.arc(14, 38, 4, 0, TAU); g.fill(); },
  stalin(g, R) { g.fillStyle = '#2b2b2b'; g.beginPath(); g.arc(0, -R * .1, R * 1.02, Math.PI * 1.02, Math.PI * 1.98); g.quadraticCurveTo(0, -R * 1.25, -R, -R * .3); g.fill();
    g.fillStyle = INK; g.beginPath(); g.moveTo(-34, 22); g.quadraticCurveTo(0, -2, 34, 22); g.quadraticCurveTo(20, 14, 0, 16); g.quadraticCurveTo(-20, 14, -34, 22); g.fill(); },
  hitler(g, R) { g.fillStyle = INK; g.beginPath(); g.arc(0, -R * .12, R * 1.02, Math.PI * 1.02, Math.PI * 1.98); g.lineTo(R * .2, -R * .55); g.lineTo(-R * .75, -R * .1); g.closePath(); g.fill();
    g.fillRect(-9, 12, 18, 11); },
};
const SPEC = {
  vlad: { robe: '#5a1a1a', sash: '#c9a227', trim: '#c9a227', scale: 1 },
  ivan: { robe: '#3b4f9e', sash: '#e0a82e', trim: '#e0a82e', beard: true, beardColor: '#3b2a1a', scale: 1 },
  son: { robe: '#7aa6d6', sash: '#fff', scale: .82 },
  amin: { robe: '#4f6b2f', sash: '#c9a227', fat: true, scale: 1.05 },
  leo: { robe: '#5b2d8a', sash: '#e8322b', trim: '#f2c230', beard: true, beardColor: '#e9e9e9', scale: 1 },
  timur: { robe: '#7a4a22', sash: '#c9a227', turban: '#f2efe6', beard: true, beardColor: '#2a1d10', scale: 1 },
  hulagu: { robe: '#8a3a1e', sash: '#3b2616', vest: '#5a3a1e', scale: 1 },
  polpot: { robe: '#1d1d1d', sash: '#e34b4b', scale: 1 },
  mao: { robe: '#6f7a6a', sash: '#6f7a6a', scale: 1 },
  stalin: { robe: '#8c8a74', sash: '#8c8a74', trim: '#c9a227', scale: 1 },
  hitler: { robe: '#7a6440', sash: '#5a4630', scale: 1 },
  citizen: i => ({ robe: ['#c96d4d', '#4d8cc9', '#6aa357', '#c9a64d'][i % 4], sash: '#eee', scale: .62 }),
};
function guy(k, p) { return drawChar(g, SPEC[k], Object.assign({ extraHead: HATS[k] }, p)); }

// ---------- header, captions, progress ----------
function header(sc, u) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const k = seg(u, 0, .32), s = k < 1 ? lerp(2.6, 1, easeOut(k)) : 1 + .04 * Math.max(0, Math.sin((u - .32) * 3)) * Math.exp(-(u - .32));
  g.save(); g.translate(W / 2, 230); g.scale(s, s); g.globalAlpha = clamp(k * 3);
  g.fillStyle = '#d91f26'; g.beginPath(); g.arc(0, 0, 92, 0, TAU); g.fill(); g.lineWidth = 8; g.strokeStyle = '#000'; g.stroke(); g.lineWidth = 4; g.strokeStyle = '#ffcf3a'; g.beginPath(); g.arc(0, 0, 80, 0, TAU); g.stroke();
  txt(String(sc.rank), 0, 10, 120, '#fff', 'Lalezar', 10); g.restore();
  const n = seg(u, .25, .6); g.save(); g.globalAlpha = n; g.translate(0, (1 - easeOut(n)) * 30);
  txt(sc.name, W / 2, 392, 92, '#fff', 'Lalezar', 14); txt(sc.sub, W / 2, 468, 38, '#ffd9a0', 'Cairo', 8); g.restore();
}
function captions(t) {
  const c = CFG.caps.find(c => t >= c[0] && t < c[1] + .12); if (!c) return;
  g.setTransform(1, 0, 0, 1, 0, 0); const k = seg(t, c[0], c[0] + .18), s = lerp(.86, 1, easeOut(k));
  g.save(); g.translate(W / 2, 1430); g.scale(s, s); g.globalAlpha = clamp(k * 2);
  g.font = "900 58px 'Cairo'"; let w = Math.min(980, g.measureText(c[2]).width) + 70;
  g.fillStyle = 'rgba(0,0,0,.62)'; g.beginPath(); g.roundRect(-w / 2, -52, w, 104, 26); g.fill();
  txt(c[2], 0, 4, 58, '#fff', 'Cairo', 0, '#000', 'center', 940); g.restore();
}
function progress(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); const sc = CFG.scenes.find(s => t >= s.t0 && t < s.t1); if (!sc || !sc.rank) return;
  for (let r = 10; r >= 1; r--) { const x = W / 2 + (r - 5.5) * 64, cur = r === sc.rank, done = r > sc.rank;
    g.fillStyle = cur ? '#d91f26' : done ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.15)'; g.beginPath(); g.arc(x, 1545, cur ? 22 : 15, 0, TAU); g.fill();
    if (cur) { g.strokeStyle = '#fff'; g.lineWidth = 4; g.stroke(); txt(String(r), x, 1548, 24, '#fff', 'Cairo'); } }
}

// ---------- scenes ----------
const SC = {};
SC.intro = (u, D, t) => {
  grad('#1a0607', '#050203'); g.setTransform(1, 0, 0, 1, 0, 0);
  const z = lerp(1, 1.08, u / D); g.translate(W / 2, 900); g.scale(z, z); g.translate(-W / 2, -900);
  dust(t, '255,120,90');
  // red ground glow
  const gr = g.createRadialGradient(W / 2, GY, 50, W / 2, GY, 700); gr.addColorStop(0, 'rgba(200,30,30,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 700, W, 1000);
  const keys = ['vlad', 'ivan', 'amin', 'leo', 'timur', 'hulagu', 'polpot', 'mao', 'stalin', 'hitler'];
  const spot = seg(u, 2.85, 3.3);
  for (let i = 0; i < 10; i++) {
    let x, y, s;
    if (i < 9) { const row = i < 5 ? 0 : 1, col = row ? i - 5 : i; x = row ? 230 + col * 207 : 140 + col * 200; y = row ? 1190 : 1060; s = .46; }
    else { x = 540; y = 1330; s = .72; }
    const a = i === 9 ? 1 : clamp(.55 + seg(u, i * .1, i * .1 + .2)); 
    const hl = i === 9 ? spot : 0;
    if (i === 9 && spot > 0) { g.save(); g.globalAlpha = spot * .7; const sg = g.createRadialGradient(x, y - 150, 20, x, y - 150, 330); sg.addColorStop(0, 'rgba(255,60,60,.9)'); sg.addColorStop(1, 'rgba(255,0,0,0)'); g.fillStyle = sg; g.fillRect(x - 340, y - 500, 680, 600); g.restore(); fire('hit', t); }
    g.save(); g.globalAlpha = a; g.filter = `brightness(${lerp(.3, 1, hl)})`; guy(keys[i], { x, y, s, eyes: hl ? 'squint' : 'closed', brows: 'angry', mouth: hl ? 'smile' : 'line' }); g.restore(); g.filter = 'none';
    if (i * .1 + .05 < u && i < 9) fire('tick#' + i, t);
    if (i === 9 && spot <= 0) txt('؟', x, y - 300, 120, '#ff3b3b', 'Lalezar', 10);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const tk = 1 + .05 * Math.sin(u * 3);
  g.save(); g.translate(W / 2, 330); g.scale(tk || .001, tk || .001); txt('أسوأ 10 أشخاص', 0, 0, 132, '#fff', 'Lalezar', 16); g.restore();
  const tk2 = 1; g.save(); g.translate(W / 2, 480); g.scale(tk2 || .001, tk2 || .001); txt('في التاريخ', 0, 0, 110, '#ff3b3b', 'Lalezar', 14); g.restore();
  if (u > 2.9) { const q = pop(u, 2.9, .35); g.save(); g.translate(W / 2, 700); g.scale(q, q); txt('رقم 1 راح يصدمك 😱', 0, 0, 64, '#ffd23b', 'Cairo', 10); g.restore(); }
  fire('whoosh', t);
};
SC.vlad = (u, D, t) => {
  grad('#3a0b0b', '#120404'); g.setTransform(1, 0, 0, 1, 0, 0); shake(u, 2.5, 8);
  // moon + castle
  g.fillStyle = '#f3e3c0'; g.beginPath(); g.arc(860, 640, 70, 0, TAU); g.fill();
  g.fillStyle = '#160505'; g.beginPath(); g.moveTo(-50, GY - 60); g.quadraticCurveTo(250, 760, 520, GY - 80); g.lineTo(520, GY); g.lineTo(-50, GY); g.fill();
  g.fillRect(90, 760, 70, 160); g.fillRect(170, 800, 150, 120); g.fillRect(300, 730, 60, 190); for (let x = 90; x < 360; x += 24) g.fillRect(x, 718 + (x > 290 ? 0 : 30), 14, 22);
  ground('#2a0d0a');
  // stakes rising one by one
  for (let i = 0; i < 7; i++) { const a = seg(u, 2.4 + i * .22, 2.65 + i * .22); if (a <= 0) continue; const x = 560 + i * 72 - (i % 2) * 20, h = 300 + (i % 3) * 50;
    g.fillStyle = '#6b4423'; g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.moveTo(x - 9, GY); g.lineTo(x + 9, GY); g.lineTo(x, GY - h * easeOut(a)); g.closePath(); g.fill(); g.stroke(); fire('stake#' + i, t); }
  // crows
  for (let i = 0; i < 4; i++) { const x = (900 - ((u * 120 + i * 230) % 1300)), y = 650 + i * 40 + Math.sin(u * 3 + i) * 15, f = Math.sin(u * 12 + i) * 12; g.strokeStyle = '#000'; g.lineWidth = 5; g.beginPath(); g.moveTo(x - 22, y - f); g.quadraticCurveTo(x - 8, y - 6, x, y); g.quadraticCurveTo(x + 8, y - 6, x + 22, y - f); g.stroke(); }
  // Vlad behind a dinner table
  const eat = seg(u, 4.6, 5.0), chew = u > 5.0;
  const p = guy('vlad', { x: 300, y: GY + 40, s: 1.15, armR: u > 4.6 ? lerp(.3, 2.25, eat) - (chew ? .25 * Math.abs(Math.sin(u * 7)) : 0) : .3, armL: .5, eyes: u > 2.4 ? 'squint' : 'dot', brows: 'angry', mouth: chew ? 'smile' : 'line', talk: chew ? .25 + .2 * Math.abs(Math.sin(u * 9)) : 0, look: .5 });
  g.fillStyle = '#5a3418'; g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.roundRect(110, GY - 150, 400, 26, 6); g.fill(); g.stroke(); g.fillRect(140, GY - 124, 18, 124); g.fillRect(460, GY - 124, 18, 124);
  g.fillStyle = '#ddd'; g.beginPath(); g.ellipse(370, GY - 156, 60, 14, 0, 0, TAU); g.fill(); g.stroke(); g.fillStyle = '#a0522d'; g.beginPath(); g.ellipse(370, GY - 166, 32, 14, 0, 0, TAU); g.fill();
  g.fillStyle = '#7a1414'; g.beginPath(); g.moveTo(200, GY - 150); g.lineTo(212, GY - 210); g.lineTo(224, GY - 150); g.fill(); // goblet
  if (p.hands) { const [hx, hy] = p.hands[1]; g.strokeStyle = '#bbb'; g.lineWidth = 5; g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx - 10, hy - 38); g.stroke(); g.fillStyle = '#a0522d'; g.beginPath(); g.arc(hx - 11, hy - 42, 8, 0, TAU); g.fill(); }
  if (u > 4.6) fire('chomp', t);
  vignette(); header(CFG.scenes[1], u);
};
SC.ivan = (u, D, t) => {
  grad('#0e1430', '#04060f'); g.setTransform(1, 0, 0, 1, 0, 0); shake(u, 3.95, 16);
  dust(t, '200,220,255');
  // onion domes

    txt('موت واحد = مأساة', 740, 625, 44, '#fff', 'Cairo'); person(740, 720, 1.2, '#ff4b4b');
    const m = seg(u, 7.4, 7.7); if (m > 0) { g.globalAlpha = q * m; txt('موت مليون = رقم', 740, 790, 44, '#ffd23b', 'Cairo'); txt(fmt(counter(u, 7.5, 1.2, 0, 1000000)), 740, 870, 60, '#ff4b4b', 'Cairo'); fire('ticks2', t); }
    g.restore(); }
  vignette(); header(CFG.scenes[9], u);
};
SC.hitler = (u, D, t) => {
  grad('#2b0f0f', '#050202'); g.setTransform(1, 0, 0, 1, 0, 0); shake(u, 2.1, 14, .7);
  dust(t, '255,140,90'); ground('#1d1414');
  // globe
  const gx = 760, gy = 900, gr_ = 200, burn = easeOut(seg(u, 2.1, 3.6));
  g.fillStyle = '#2a6fb5'; g.beginPath(); g.arc(gx, gy, gr_, 0, TAU); g.fill(); g.save(); g.beginPath(); g.arc(gx, gy, gr_, 0, TAU); g.clip();
  g.fillStyle = '#3f9e4f'; for (const [x, y, rx, ry] of [[-80, -60, 90, 60], [70, -90, 70, 40], [60, 40, 60, 90], [-90, 90, 50, 60], [130, 0, 40, 30]]) { g.beginPath(); g.ellipse(gx + x, gy + y, rx, ry, .3, 0, TAU); g.fill(); }
  g.fillStyle = `rgba(30,0,0,${.65 * burn})`; g.fillRect(gx - gr_, gy - gr_, gr_ * 2, gr_ * 2); g.restore(); g.strokeStyle = '#000'; g.lineWidth = 6; g.beginPath(); g.arc(gx, gy, gr_, 0, TAU); g.stroke();
  if (burn > 0) { for (let i = 0; i < 16; i++) { const a = i / 16 * TAU + t * .2, rr = gr_ - 10, x = gx + Math.cos(a) * rr * .8, y = gy + Math.sin(a) * rr * .8, h = (40 + 40 * Math.abs(Math.sin(t * 7 + i))) * burn;
    const fg = g.createLinearGradient(0, y, 0, y - h); fg.addColorStop(0, 'rgba(255,170,30,.95)'); fg.addColorStop(1, 'rgba(255,40,0,0)'); g.fillStyle = fg; g.beginPath(); g.moveTo(x - 16, y); g.quadraticCurveTo(x, y - h * 1.4, x + 16, y); g.fill(); } fire('fire2', t); }
  const shout = u > .4 && u < 3.6;
  guy('hitler', { x: 250, y: GY, s: 1.2, armR: u > 2.0 && u < 3.6 ? 2.7 + .15 * Math.sin(u * 14) : .4, armL: .35, eyes: 'squint', brows: 'angry', mouth: shout ? 'open' : 'frown', talk: 0, look: .5 });
  g.fillStyle = '#c41e1e'; g.fillRect(180, GY - 1.2 * 170, 26, 34); // plain armband
  const c = counter(u, 3.77, 1.9, 0, 60000000);
  if (u > 3.77) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = 'rgba(0,0,0,.75)'; g.beginPath(); g.roundRect(470, 1140, 580, 120, 22); g.fill(); txt('+' + fmt(c), 760, 1185, 64, '#ff4b4b', 'Cairo'); txt('إنسان', 760, 1240, 30, '#fff', 'Cairo'); fire('ticks3', t); }
  flash(u, 2.1, '255,120,40', .5);
  vignette(); header(CFG.scenes[10], u);
};
SC.outro = (u, D, t) => {
  grad('#1a0607', '#050203'); g.setTransform(1, 0, 0, 1, 0, 0); dust(t, '255,120,90');
  const keys = ['vlad', 'ivan', 'amin', 'leo', 'timur', 'hulagu', 'polpot', 'mao', 'stalin', 'hitler'];
  for (let i = 0; i < 11; i++) { const col = i % 4, row = Math.floor(i / 4), x = 210 + col * 220, y = 760 + row * 200;
    if (i < 10) { g.save(); g.globalAlpha = seg(u, i * .06, i * .06 + .3); guy(keys[i], { x, y: y + 60, s: .42, eyes: 'squint', brows: 'angry', mouth: 'line' }); g.restore(); txt(String(10 - i), x + 62, y - 80, 34, '#ff4b4b', 'Cairo', 6); }
    else { const q = seg(u, 2.1, 2.4); if (q > 0) { const pl = 1 + .08 * Math.sin(t * 6); g.save(); g.globalAlpha = q; g.translate(x, y); g.scale(pl, pl); g.setLineDash([12, 10]); g.strokeStyle = '#ffd23b'; g.lineWidth = 6; g.beginPath(); g.roundRect(-70, -90, 140, 160, 20); g.stroke(); g.setLineDash([]); txt('؟', 0, -10, 110, '#ffd23b', 'Lalezar', 8); g.restore(); fire('ding', t); } } }
  g.setTransform(1, 0, 0, 1, 0, 0);
  chip('حسب تقديرات المؤرخين', W / 2, 400, 44, '#222', '#ffd9a0', seg(u, .1, .4));
  if (u > 2.1) { const q = pop(u, 2.1, .3); g.save(); g.translate(W / 2, 540); g.scale(q, q); txt('منو ينضاف للقائمة؟', 0, 0, 84, '#fff', 'Lalezar', 12); g.restore(); }
  // comment bubble
  const cb = pop(u, 4.4, .3); if (cb > 0) { g.save(); g.translate(260, 1290); g.scale(cb, cb); g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 5; g.beginPath(); g.roundRect(-110, -60, 220, 110, 24); g.fill(); g.stroke(); g.beginPath(); g.moveTo(-40, 48); g.lineTo(-60, 90); g.lineTo(0, 48); g.fill(); txt('...', 0, -6, 60, '#000', 'Cairo'); g.restore(); fire('pop', t); }
  // subscribe
  const sb = pop(u, 5.9, .3); if (sb > 0) { const press = u > 6.9 && u < 7.2 ? .92 : 1, done = u > 7.05; g.save(); g.translate(720, 1290); g.scale(sb * press, sb * press); g.fillStyle = done ? '#555' : '#e8322b'; g.strokeStyle = '#000'; g.lineWidth = 5; g.beginPath(); g.roundRect(-190, -55, 380, 110, 55); g.fill(); g.stroke(); txt(done ? 'مشترك ✓' : 'اشترك', 0, 4, 58, '#fff', 'Cairo'); g.restore();
    if (u > 6.4 && u < 7.4) { const hx = lerp(900, 760, easeOut(seg(u, 6.4, 6.9))), hy = lerp(1460, 1325, easeOut(seg(u, 6.4, 6.9))); g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 5; g.beginPath(); g.arc(hx, hy, 26, 0, TAU); g.fill(); g.stroke(); g.beginPath(); g.roundRect(hx - 8, hy - 70, 16, 50, 8); g.fill(); g.stroke(); }
    if (done) fire('click', t); }
  vignette();
};

function frame() {
  const t = FI / FPS; g.setTransform(1, 0, 0, 1, 0, 0); g.filter = 'none'; g.globalAlpha = 1;
  const sc = CFG.scenes.find(s => t >= s.t0 && t < s.t1) || CFG.scenes[CFG.scenes.length - 1];
  const u = t - sc.t0; if (u < .02 && sc.rank) fire('slam#' + sc.rank, t);
  SC[sc.k](u, sc.t1 - sc.t0, t);
  // quick wipe at cut
  if (sc.rank && u < .12) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(0,0,0,${1 - u / .12})`; g.fillRect(0, 0, W, H); }
  progress(t); captions(t);
  FI++;
}
function seek(i) { FI = i; }
